name: Weekly R4 Discord overview
on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send OOPZ weekly overview
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${{ secrets.WEEKLY_REPORT_SECRET }}" \
            https://lwoopz.dpdns.org/api/admin/weekly-report
